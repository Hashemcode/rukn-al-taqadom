name = "rukn-admin-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
REPO = "Hashemcode/rukn-al-taqadom"
BRANCH = "main"
ALLOWED_ORIGINS = "https://hashemcode.github.io,http://localhost:8770"

# Secrets (set with `wrangler secret put`): GITHUB_TOKEN, SESSION_SECRET
# GITHUB_TOKEN must be a fine-grained PAT for Hashemcode/rukn-al-taqadom
# (Contents: read/write, Actions: read).

[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_WITH_KV_ID"
